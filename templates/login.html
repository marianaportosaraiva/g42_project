{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<h1>Login</h1>

<form id="form" action="{{ url_for('chklogin') }}" method="post">
    <div class="field">
        <label for="user">Utilizador:</label>
        <input type="text" id="user" name="user" value="{{ user }}" autocomplete="username" />
    </div>
    <div class="field">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="current-password" />
    </div>
    <div class="btn-bar" style="justify-content:center; margin-top:10px;">
        <button type="submit" class="button1">Login</button>
    </div>
</form>

{% if resul and resul != "" %}
<div class="info-box info-error" style="margin-top:16px; text-align:center;">
    {{ resul }}
</div>
{% endif %}

{% endblock %}
