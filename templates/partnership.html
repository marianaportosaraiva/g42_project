{% extends "base.html" %}
{% block title %}Parcerias{% endblock %}
{% block content %}
<h1> Parcerias</h1>

<div class="btn-bar">
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('partnership') }}?option=edit'">️ Editar</button>
    <button class="button1 danger" {{ butshow }} onclick="if(confirm('Eliminar esta parceria?')) window.location.href='{{ url_for('partnership') }}?option=delete'">️ Eliminar</button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('partnership') }}?option=insert'"> Inserir</button>
    <button class="button1" {{ butedit }} type="submit" form="form"> Guardar</button>
    <button class="button1" {{ butedit }} onclick="window.location.href='{{ url_for('partnership') }}?option=cancel'"> Cancelar</button>
</div>

<form id="form" action="{{ url_for('partnership') }}?option=save" method="post">
    <div class="field">
        <label for="id">ID:</label>
        <input type="text" disabled id="id" name="id" value="{{ id }}" size="10"/>
    </div>
    <div class="field">
        <label for="university_id">ID Universidade:</label>
        <input type="text" {{ butedit }} id="university_id" name="university_id" value="{{ university_id }}" size="10"/>
        {% if univ_name %}<span class="sub">{{ univ_name }}</span>{% endif %}
    </div>
    <div class="field">
        <label for="program_id">ID Programa:</label>
        <input type="text" {{ butedit }} id="program_id" name="program_id" value="{{ program_id }}" size="10"/>
        {% if prog_title %}<span class="sub">{{ prog_title }}</span>{% endif %}
    </div>
    <div class="field">
        <label for="course_start_date">Início do Curso:</label>
        <input type="text" {{ butedit }} id="course_start_date" name="course_start_date" value="{{ course_start_date }}" placeholder="YYYY-MM-DD" size="20"/>
    </div>
    <div class="field">
        <label for="students_number">Nº de Estudantes:</label>
        <input type="number" {{ butedit }} id="students_number" name="students_number" value="{{ students_number }}" size="10"/>
    </div>
</form>

<div class="nav-bar">
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('partnership') }}?option=first'"> Primeiro</button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('partnership') }}?option=previous'"> Anterior</button>
    <span>{{ pos }} / {{ total }}</span>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('partnership') }}?option=next'">Seguinte </button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('partnership') }}?option=last'">Último </button>
</div>
{% endblock %}
