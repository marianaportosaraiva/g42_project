{% extends "base.html" %}
{% block title %}Programas{% endblock %}
{% block content %}
<h1> Programas</h1>

<div class="btn-bar">
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('program') }}?option=edit'">️ Editar</button>
    <button class="button1 danger" {{ butshow }} onclick="if(confirm('Eliminar este programa?')) window.location.href='{{ url_for('program') }}?option=delete'">️ Eliminar</button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('program') }}?option=insert'"> Inserir</button>
    <button class="button1" {{ butedit }} type="submit" form="form"> Guardar</button>
    <button class="button1" {{ butedit }} onclick="window.location.href='{{ url_for('program') }}?option=cancel'"> Cancelar</button>
</div>

<form id="form" action="{{ url_for('program') }}?option=save" method="post">
    <div class="field">
        <label for="id">ID:</label>
        <input type="text" disabled id="id" name="id" value="{{ id }}" size="10"/>
    </div>
    <div class="field">
        <label for="title">Título:</label>
        <input type="text" {{ butedit }} id="title" name="title" value="{{ title }}" size="40"/>
    </div>
    <div class="field">
        <label for="category">Categoria:</label>
        <input type="text" {{ butedit }} id="category" name="category" value="{{ category }}" size="30"/>
    </div>
</form>

<div class="nav-bar">
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('program') }}?option=first'"> Primeiro</button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('program') }}?option=previous'"> Anterior</button>
    <span>{{ pos }} / {{ total }}</span>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('program') }}?option=next'">Seguinte </button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('program') }}?option=last'">Último </button>
</div>
{% endblock %}
