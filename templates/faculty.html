{% extends "base.html" %}
{% block title %}Faculdades{% endblock %}
{% block content %}
<h1> Faculdades</h1>

<div class="btn-bar">
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('faculty') }}?option=edit'">️ Editar</button>
    <button class="button1 danger" {{ butshow }} onclick="if(confirm('Eliminar esta faculdade?')) window.location.href='{{ url_for('faculty') }}?option=delete'">️ Eliminar</button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('faculty') }}?option=insert'"> Inserir</button>
    <button class="button1" {{ butedit }} type="submit" form="form"> Guardar</button>
    <button class="button1" {{ butedit }} onclick="window.location.href='{{ url_for('faculty') }}?option=cancel'"> Cancelar</button>
</div>

<form id="form" action="{{ url_for('faculty') }}?option=save" method="post">
    <div class="field">
        <label for="id">ID:</label>
        <input type="text" disabled id="id" name="id" value="{{ id }}" size="10"/>
    </div>
    <div class="field">
        <label for="info">Informação:</label>
        <input type="text" {{ butedit }} id="info" name="info" value="{{ info }}" size="40"/>
    </div>
    <div class="field">
        <label for="university_id">ID Universidade:</label>
        <input type="text" {{ butedit }} id="university_id" name="university_id" value="{{ university_id }}" size="10"/>
    </div>
    {% if univ_name %}
    <div class="field">
        <label>Universidade:</label>
        <span style="color:#334a94; font-style:italic;">{{ univ_name }}</span>
    </div>
    {% endif %}
</form>

<div class="nav-bar">
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('faculty') }}?option=first'"> Primeiro</button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('faculty') }}?option=previous'"> Anterior</button>
    <span>{{ pos }} / {{ total }}</span>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('faculty') }}?option=next'">Seguinte </button>
    <button class="button1" {{ butshow }} onclick="window.location.href='{{ url_for('faculty') }}?option=last'">Último </button>
</div>
{% endblock %}
